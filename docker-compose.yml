services:
  db:
    image: postgres:16-alpine
    container_name: codebase_analysis_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: codebase_analysis
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d codebase_analysis"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
